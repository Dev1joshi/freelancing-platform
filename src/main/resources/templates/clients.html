
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Clients | FreelanceHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 50px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            margin-bottom: 10px;
            color: #a78bfa;
        }

        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 18px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            background: #312e81;
            color: white;
        }

        tr:hover {
            background: #334155;
            transition: 0.2s;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #a78bfa;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            th, td {
                padding: 10px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Registered Clients</h1>
    <p>View all clients registered on FreelanceHub.</p>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Phone</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="client : ${clients}">
            <td th:text="${client.clientId}"></td>
            <td th:text="${client.fullName}"></td>
            <td th:text="${client.email}"></td>
            <td th:text="${client.phone}"></td>
        </tr>

        <tr th:if="${#lists.isEmpty(clients)}">
            <td colspan="4">No clients found.</td>
        </tr>
        </tbody>
    </table>

    <a href="/" class="back">← Back to Home</a>

</div>

</body>
</html>
