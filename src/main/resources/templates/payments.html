
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments | FreelanceHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #a78bfa;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
        }

        table {
            width: 100%;
            min-width: 800px;
            border-collapse: collapse;
            background: #1e293b;
        }

        th, td {
            padding: 17px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            background: #312e81;
        }

        tr:hover {
            background: #334155;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #a78bfa;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Payment Records</h1>
    <p class="subtitle">Track transactions and payment status.</p>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Payment ID</th>
                <th>Contract ID</th>
                <th>Amount</th>
                <th>Payment Date</th>
                <th>Method</th>
                <th>Status</th>
                <th>Transaction Reference</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="payment : ${payments}">
                <td th:text="${payment.paymentId}"></td>
                <td th:text="${payment.contractId}"></td>
                <td>₹<span th:text="${payment.amount}"></span></td>
                <td th:text="${payment.paymentDate}"></td>
                <td th:text="${payment.paymentMethod}"></td>
                <td th:text="${payment.status}"></td>
                <td th:text="${payment.transactionReference}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(payments)}">
                <td colspan="7">No payment records found.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <a href="/" class="back">← Back to Home</a>

</div>

</body>
</html>
