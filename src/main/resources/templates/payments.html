
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments | FreelanceHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            color: #a78bfa;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
        }

        table {
            width: 100%;
            min-width: 1000px;
            border-collapse: collapse;
            background: #1e293b;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            background: #312e81;
        }

        tr:hover {
            background: #334155;
        }

        .status {
            font-weight: bold;
        }

        .pending {
            color: #fbbf24;
        }

        .completed {
            color: #4ade80;
        }

        .failed {
            color: #f87171;
        }

        .complete-btn {
            padding: 9px 12px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .complete-btn:hover {
            background: #15803d;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #a78bfa;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Payment Records</h1>
    <p class="subtitle">Track transactions and payment status.</p>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Payment ID</th>
                <th>Contract ID</th>
                <th>Amount</th>
                <th>Payment Date</th>
                <th>Method</th>
                <th>Status</th>
                <th>Transaction Reference</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="payment : ${payments}">
                <td th:text="${payment.paymentId}"></td>
                <td th:text="${payment.contractId}"></td>

                <td>
                    ₹<span th:text="${payment.amount}"></span>
                </td>

                <td th:text="${payment.paymentDate}"></td>
                <td th:text="${payment.paymentMethod}"></td>

                <td>
                    <span class="status"
                          th:classappend="${payment.status == 'PENDING' ? ' pending' :
                                           (payment.status == 'COMPLETED' ? ' completed' : ' failed')}"
                          th:text="${payment.status}">
                    </span>
                </td>

                <td th:text="${payment.transactionReference != null ?
                              payment.transactionReference : 'N/A'}">
                </td>

                <td>
                    <form th:if="${payment.status == 'PENDING'}"
                          th:action="@{/payments/{id}/status(id=${payment.paymentId})}"
                          method="post">

                        <input type="hidden" name="status" value="COMPLETED">

                        <button type="submit" class="complete-btn">
                            Mark Completed
                        </button>
                    </form>

                    <span th:if="${payment.status == 'COMPLETED'}">
                        Completed
                    </span>

                    <span th:if="${payment.status == 'FAILED'}">
                        Failed
                    </span>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(payments)}">
                <td colspan="8">No payment records found.</td>
            </tr>

            </tbody>
        </table>
    </div>

    <a href="/" class="back">← Back to Home</a>

</div>

</body>
</html>
